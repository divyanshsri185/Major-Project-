<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Invigil — Third Eye</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;background:#0b1020;color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    main{width:min(100%,560px);background:#151d30;border:1px solid #34415c;border-radius:18px;padding:22px;box-sizing:border-box}
    h1{font-size:1.4rem;margin:0 0 8px}p{color:#cbd5e1;line-height:1.5}
    video{width:100%;background:#05070d;border-radius:12px;display:none;aspect-ratio:4/3;object-fit:cover}
    button{border:0;border-radius:10px;background:#2563eb;color:white;padding:13px 16px;font-weight:650;font-size:1rem;width:100%;margin-top:12px}
    button:disabled{opacity:.55}#status{padding:12px;background:#0b1222;border-radius:10px;font-size:.95rem}
    .small{font-size:.85rem;color:#94a3b8}
  </style>
</head>
<body>
  <main>
    <h1>Third Eye — Phone Camera</h1>
    <p>Keep this page open while your phone camera streams to the Invigil exam screen. Use the HTTPS link provided by the laptop.</p>
    <div id="status" role="status">Ready to connect.</div>
    <video id="camera" autoplay muted playsinline></video>
    <button id="connect" type="button">Allow camera and connect</button>
    <p class="small">Camera access is used for the live exam preview. Keep the phone awake and on the same network if possible.</p>
  </main>
  <script src="/phone.js" defer></script>
</body>
</html>
